name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le projet
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatage
        run: ruff format --check .
      - name: Tests
        run: pytest
